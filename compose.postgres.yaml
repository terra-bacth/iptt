version: "2.4"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: iptt
      POSTGRES_USER: iptt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iptt -d iptt"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    image: iptt:ui-postgres-lab
    environment:
      DATABASE_URL: postgresql+psycopg2://iptt:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/iptt
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/login', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    restart: unless-stopped
volumes:
  postgres-data:

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}IPTT | Project Governance Workspace{% endblock %}</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('iptt-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=13">
    <link rel="stylesheet" href="/static/theme.css?v=13">
    <script src="/static/ui.js?v=13" defer></script>
    {% block head %}{% endblock %}
</head>
<body class="iptt-ui">
<a class="iptt-skip" href="#iptt-main">Skip to main content</a>
<main id="iptt-main" tabindex="-1">
    {% block content %}
    {% endblock %}
</main>
{% include "partials/footer.html" %}
</body>
</html>

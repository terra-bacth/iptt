# Replace image before applying. Credentials are created separately.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iptt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: iptt
  template:
    metadata:
      labels:
        app: iptt
    spec:
      containers:
        - name: iptt
          image: artifactory.example.com/docker-local/iptt:ui-postgres-lab
          ports:
            - containerPort: 8080
          env:
            - name: HOST
              value: "::"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: iptt-secret
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: iptt-secret
                  key: SESSION_SECRET
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: iptt
spec:
  selector:
    app: iptt
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: iptt
spec:
  to:
    kind: Service
    name: iptt
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
